# /etc/nginx/sites-available/fruits.road-test.uz
#
# lugatim.road-test.uz bilan bir xil uslub (server konvensiyasiga mos).
#
# O'rnatish:
#   sudo cp deploy/nginx-fruits.road-test.uz.conf /etc/nginx/sites-available/fruits.road-test.uz
#   sudo ln -s /etc/nginx/sites-available/fruits.road-test.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fruits.road-test.uz
#
# certbot ushbu faylni avtomatik tahrirlab, 443-port, SSL sertifikatlari va
# http->https redirect blokini qo'shadi (lugatim.road-test.uz faylidagidek).

server {
    server_name fruits.road-test.uz;

    # multer 8MB gacha rasm qabul qiladi, nginx default (1MB) buni bloklaydi
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:4005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
